function vul(w,c){
  w.ht=c.type;w.renderForm(c.type);
  function auteurs(px,lijst){
    (lijst||[]).forEach(function(a,i){
      if(i>0)w.addAut(px);
      var rij=w.document.querySelectorAll('#'+px+'-rows .arow')[i];
      rij.querySelector('.a-ach').value=a[0];rij.querySelector('.a-vrl').value=a[1];rij.querySelector('.a-tss').value=a[2];
    });
  }
  auteurs('auth',c.aut);auteurs('red',c.red);
  Object.keys(c.velden||{}).forEach(function(id){
    var el=w.document.getElementById(id);
    if(!el)throw new Error('Veld '+id+' bestaat niet in formulier '+c.type);
    if(el.type==='checkbox')el.checked=!!c.velden[id];else el.value=c.velden[id];
  });
  return w.gens[c.type]();
}
function tekst(html){var d=document.createElement('div');d.innerHTML=html||'';return d.textContent.replace(/\s+/g,' ').trim();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

document.getElementById('app').onload=function(){
  var w=this.contentWindow,goed=0,uit=document.getElementById('resultaten');
  CASES.forEach(function(c){
    var fouten=[],r;
    try{r=vul(w,c);}catch(e){fouten.push('Fout: '+e.message);}
    if(r===null)fouten.push('Generator gaf null (verplicht veld leeg?)');
    if(r){
      ['bl','lp','hk'].forEach(function(k){if(c[k]!==undefined&&r[k]!==c[k])fouten.push({k:k,verwacht:c[k],kreeg:r[k]});});
      if(c.noot&&tekst(r.note).indexOf(c.noot)<0)fouten.push({k:'noot',verwacht:c.noot,kreeg:tekst(r.note)});
    }
    if(!fouten.length)goed++;
    var d=document.createElement('div');d.className='case'+(fouten.length?' rood':'');
    d.innerHTML='<b>'+(fouten.length?'✗ ':'✓ ')+esc(c.naam)+' <span class="ref">'+esc(c.type+' · '+c.ref)+'</span></b>'+
      fouten.map(function(f){return typeof f==='string'?'<div class="diff k">'+esc(f)+'</div>':
        '<div class="diff">'+f.k+':\n<span class="v">verwacht: '+esc(f.verwacht)+'</span>\n<span class="k">kreeg:    '+esc(f.kreeg)+'</span></div>'}).join('');
    uit.appendChild(d);
  });
  var s=document.getElementById('samenvatting');
  s.textContent=goed+' van '+CASES.length+' tests geslaagd';
  s.className=goed===CASES.length?'ok':'fout';
  document.title=(goed===CASES.length?'✓ ':'✗ ')+goed+'/'+CASES.length+' APA-tests';
};
